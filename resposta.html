<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabarito-Trabalhando com Alinhamento</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .esquerda{
            text-align:left;
            vertical-align:top;

        }

        .Padrão centro{
            text-align:center;
            vertical-align:middle;
        
        }

        .direita{
            text-align:right;
            vertical-align:right;
            
         }

         .topo{
            text-align:center;
            vertical-align:top;
            
         }

         .Padrão{
            text-align:center;
            vertical-align:middle;

        }

        .baixo{
            text-align:center;
            vertical-align:bottom;

         }

         .topo{
            text-align:center;
            vertical-align:top;
            
         }

         .baixo{
            text-align:center;
            vertical-align:bottom;
        
         }

         .Padrão{
            text-align:center;
            vertical-align:middle;
        
         }
         
         .A4{
            text-align:center;
            vertical-align:middle;

         }

         .Número à .direita{
            text-align:right;
            vertical-align:bottom;
        
        }
        .A4{
            text-align:center;
            vertical-align:middle;
        
         }

        
        table {
            /* lagura */
            width: 400px;
            /* Altura */
            height: 400px;
            /* Para unir as linhas entre as celulas */
            border-collapse: collapse;
        }

        td {
            border: 1px solid rgb(0, 0, 0);
            padding: 8px;
            /* Alinhamento horizontal 
                - center - centro
                - left - esquerda
                - right - direita
            */
            text-align: center;
            /* Alinhamento vertical
                - top - em cima
                - bottom - em baixo
                - middle - no centro
            */
            vertical-align: middle;
        }

        .numero {
            text-align: right;
        }


    </style>
</head>
<body>
    <h1>Gabarito-Trabalhando com Alinhamento</h1>
    
    <table>
        <tr> 
            <td class="esquerda">A1<br>(esquerda)</td> 
            <td class="padrão centro">B1<br>(padrão centro)</td> 
            <td class="direita">C1<br>(direita)</td> 
        </tr> 
        <tr class="linha">
            <td class="topo">A2<br>(topo)</td> 
            <td class="padrão">B2<br>(padrão)</td> 
            <td class="baixo">C2<br>(baixo)</td>
        </tr>
        <tr> 
            <td class="topo">A3<br>(topo)</td>
            <td class="baixo">B3<br>(baixo)</td>
            <td class="padrão">C3<br>(padrão)</td>
        </tr>
        <tr> 
            <td class="center">A4</td>
            <td class="direita">1000<br>(número à direita)</td>
            <td class="center">C4</td>
        </tr>

    </table>
    
</body>
</html>
